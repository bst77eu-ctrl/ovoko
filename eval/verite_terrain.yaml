# Vérité terrain pour l'évaluation de l'extraction.
#
# Pour chaque capture placée dans eval/captures/, notez À LA MAIN les
# valeurs réellement lisibles sur l'image. Un champ que vous ne pouvez pas
# lire vous-même doit valoir null : le modèle est alors attendu sur null
# aussi (le score "prudence" mesure exactement cela).
#
# Exemple (décommentez et adaptez) :
# captures:
#   - fichier: capture_01.png
#     instrument: EURUSD
#     timeframe: H1
#     prix_actuel: 1.0850
#     plus_haut_visible: 1.0920
#     plus_bas_visible: 1.0790
#     tendance_visuelle: haussiere
#   - fichier: capture_02.png
#     instrument: BTCUSD
#     timeframe: M15
#     prix_actuel: null          # illisible sur l'image → null attendu
#     plus_haut_visible: null
#     plus_bas_visible: null
#     tendance_visuelle: laterale
captures: []
